<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10231f">
  <meta name="description" content="SmartCart — escaneie produtos e some o total da compra em tempo real.">
  <title>SmartCart</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --fundo: #e8efec;
      --fundo-grad: linear-gradient(165deg, #eef5f2 0%, #e0ebe6 45%, #d5e4de 100%);
      --tinta: #10231f;
      --tinta-suave: #5b6b67;
      --verde: #0b6e4f;
      --verde-escuro: #08543c;
      --amarelo: #ffd23f;
      --vermelho: #c0392b;
      --papel: #ffffff;
      --linha: #d7dfdd;
      --flash: rgba(11, 110, 79, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--fundo);
      background-image: var(--fundo-grad);
      background-attachment: fixed;
      color: var(--tinta);
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 120px;
      min-height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo-marca {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--verde);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-marca svg { width: 22px; height: 22px; }
    header h1 {
      font-size: 26px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    header p {
      color: var(--tinta-suave);
      font-size: 13px;
      margin-top: 2px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-weight: 600;
      min-height: 48px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--amarelo);
      outline-offset: 2px;
    }

    .btn-principal { background: var(--verde); color: #fff; width: 100%; }
    .btn-principal:hover { background: var(--verde-escuro); }
    .btn-parar { background: var(--tinta); color: #fff; }
    .btn-parar:hover { background: #000; }
    .btn-secundario {
      background: transparent;
      color: var(--tinta);
      border: 2px solid var(--linha);
    }
    .btn-secundario:hover { background: #fff; }

    #status {
      min-height: 24px;
      text-align: center;
      color: var(--tinta-suave);
      margin-bottom: 10px;
      font-size: 15px;
    }
    #status.ok { color: var(--verde); font-weight: 600; }
    #status.erro { color: var(--vermelho); font-weight: 600; }

    #scanner-container {
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
      display: none;
      position: relative;
    }
    #scanner-container.ativo { display: block; }
    #qr-reader { width: 100%; }

    #scanner-container.flash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--flash);
      pointer-events: none;
      animation: flash-scan 0.35s ease-out;
    }
    @keyframes flash-scan {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .entrada-manual {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .entrada-manual input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 12px;
      border: 2px solid var(--linha);
      border-radius: 10px;
      background: #fff;
      text-transform: uppercase;
    }
    .entrada-manual button { padding: 12px 16px; }

    #carrinho {
      background: var(--papel);
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
      box-shadow: 0 1px 0 var(--linha);
    }
    .carrinho-topo {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--linha);
    }
    .carrinho-topo h2 { font-size: 19px; }
    #contador { color: var(--tinta-suave); font-size: 14px; }

    .vazio {
      text-align: center;
      color: var(--tinta-suave);
      padding: 28px 8px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--linha);
      animation: item-entra 0.25s ease-out;
    }
    .item:last-child { border-bottom: none; }
    @keyframes item-entra {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .item-nome { font-weight: 600; }
    .item-unit { color: var(--tinta-suave); font-size: 13px; }
    .item-subtotal {
      text-align: right;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .item-controles {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-controles button {
      width: 44px;
      min-height: 44px;
      padding: 0;
      font-size: 20px;
      background: var(--fundo);
      color: var(--tinta);
    }
    .item-controles .qtd {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .item-controles .remover {
      margin-left: auto;
      width: auto;
      padding: 0 14px;
      font-size: 14px;
      background: transparent;
      color: var(--vermelho);
    }
    .item-controles .remover:hover { background: #fbeceb; }

    #barra-total {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--tinta);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
    }
    .barra-conteudo {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .etiqueta {
      flex: 1;
      background: var(--amarelo);
      color: var(--tinta);
      border-radius: 8px;
      padding: 8px 14px;
    }
    .etiqueta small { display: block; font-size: 12px; }
    #total {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    #btn-finalizar { background: var(--verde); color: #fff; }
    #btn-finalizar:disabled {
      background: #3b4a46;
      color: #8a9a96;
      cursor: not-allowed;
    }

    .acoes-carrinho { margin-top: 14px; text-align: right; }
    .acoes-carrinho button {
      padding: 8px 12px;
      min-height: 40px;
      font-size: 14px;
    }

    dialog {
      border: none;
      border-radius: 14px;
      padding: 22px;
      width: min(92vw, 440px);
      margin: auto;
    }
    dialog::backdrop { background: rgba(16, 35, 31, 0.6); }
    dialog h2 { margin-bottom: 4px; }
    dialog .linha-resumo {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      font-variant-numeric: tabular-nums;
    }
    dialog .total-resumo {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px dashed var(--linha);
      font-size: 20px;
      font-weight: 800;
    }
    dialog .botoes { display: flex; gap: 8px; margin-top: 18px; }
    dialog .botoes button { flex: 1; }

    details {
      margin-top: 20px;
      color: var(--tinta-suave);
      font-size: 14px;
    }
    details summary { cursor: pointer; padding: 8px 0; }
    details table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    details td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--linha);
    }
    details td:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    details code { font-weight: 700; color: var(--tinta); }

    .dica-codigos {
      margin-top: 8px;
      font-size: 13px;
      color: var(--tinta-suave);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="20" r="1.5" fill="currentColor" stroke="none"/>
        <path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L21 8H7"/>
      </svg>
    </div>
    <div>
      <h1>SmartCart</h1>
      <p>Escaneie o código de barras e some o total</p>
    </div>
  </header>

  <div id="status" role="status" aria-live="polite">
    Toque em "Iniciar leitura" para escanear os produtos.
  </div>

  <div id="scanner-container">
    <div id="qr-reader"></div>
  </div>

  <button id="btn-scanner" class="btn-principal" type="button">Iniciar leitura</button>

  <form class="entrada-manual" id="form-manual">
    <input
      id="codigo-manual"
      type="text"
      inputmode="numeric"
      placeholder="Código de barras (ex.: 7891000100011)"
      autocomplete="off"
      enterkeyhint="done"
      aria-label="Código de barras do produto"
    >
    <button class="btn-secundario" type="submit">Adicionar</button>
  </form>

  <section id="carrinho" aria-labelledby="titulo-carrinho">
    <div class="carrinho-topo">
      <h2 id="titulo-carrinho">Seu carrinho</h2>
      <span id="contador">0 itens</span>
    </div>
    <div id="itens"></div>
    <div class="acoes-carrinho">
      <button id="btn-limpar" class="btn-secundario" type="button">Limpar carrinho</button>
    </div>
  </section>

  <details>
    <summary>Códigos de barras de teste</summary>
    <p class="dica-codigos">
      Gere um EAN-13 com o número abaixo (ex.: <code>7891000100011</code>)
      ou digite o código no campo.
    </p>
    <table id="tabela-produtos"></table>
  </details>

  <div id="barra-total">
    <div class="barra-conteudo">
      <div class="etiqueta">
        <small>Total da compra</small>
        <div id="total">R$ 0,00</div>
      </div>
      <button id="btn-finalizar" type="button" disabled>Finalizar</button>
    </div>
  </div>

  <dialog id="resumo">
    <h2>Resumo da compra</h2>
    <div id="resumo-itens"></div>
    <div class="total-resumo">
      <span>Total</span>
      <span id="resumo-total"></span>
    </div>
    <div class="botoes">
      <button id="btn-voltar" class="btn-secundario" type="button">Voltar</button>
      <button id="btn-nova" class="btn-principal" type="button">Nova compra</button>
    </div>
  </dialog>

  <script>
    // Produtos embutidos (sem carregar arquivo externo)
    const bancoProdutos = {
      "7891000100011": { nome: "Leite Integral 1L", preco: 4.99 },
      "7891000100028": { nome: "Leite Desnatado 1L", preco: 5.29 },
      "7891000100035": { nome: "Queijo Mussarela 200g", preco: 14.5 },
      "7891000100042": { nome: "Iogurte Natural 170g", preco: 3.29 },
      "7891000200018": { nome: "Pão Francês", preco: 0.89 },
      "7891000200025": { nome: "Pão de Forma 500g", preco: 7.49 },
      "7891000300015": { nome: "Dúzia de Ovos", preco: 12.9 },
      "7891000400012": { nome: "Maçã Fuji (un)", preco: 1.49 },
      "7891000400029": { nome: "Banana Nanica (un)", preco: 0.79 },
      "7891000500019": { nome: "Arroz Tipo 1 5kg", preco: 24.99 },
      "7891000500026": { nome: "Feijão Carioca 1kg", preco: 8.49 },
      "7891000600016": { nome: "Café Torrado 500g", preco: 18.9 },
      "7891000600023": { nome: "Açúcar Cristal 1kg", preco: 4.29 },
      "7891000700013": { nome: "Óleo de Soja 900ml", preco: 6.99 },
      "7891000800010": { nome: "Sabão em Pó 1kg", preco: 15.9 },
      "7891000900017": { nome: "Água Mineral 1,5L", preco: 2.49 },
      "7891000900024": { nome: "Refrigerante 2L", preco: 9.99 },
      "7891001000013": { nome: "Biscoito Recheado", preco: 3.99 }
    };

    const CHAVE_STORAGE = "smartcart.carrinho";
    const ESPERA_MESMO_CODIGO_MS = 2000;
    const MSG_CAMERA = "Câmera ativa — aponte para o código de barras";

    const moeda = (v) =>
      v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const $ = (id) => document.getElementById(id);
    const normalizarCodigo = (c) => String(c || "").trim().replace(/\s+/g, "");

    let carrinho = [];

    function salvarCarrinho() {
      try {
        localStorage.setItem(CHAVE_STORAGE, JSON.stringify(carrinho));
      } catch (e) {
        console.warn("Não foi possível salvar o carrinho:", e);
      }
    }

    function carregarCarrinho() {
      try {
        const salvo = JSON.parse(localStorage.getItem(CHAVE_STORAGE));
        if (Array.isArray(salvo)) {
          carrinho = salvo.filter(
            (i) =>
              i &&
              bancoProdutos[i.id] &&
              Number.isInteger(i.quantidade) &&
              i.quantidade > 0
          );
        }
      } catch (e) {
        carrinho = [];
      }
    }

    function adicionar(id) {
      const produto = bancoProdutos[id];
      if (!produto) return false;
      const existente = carrinho.find((i) => i.id === id);
      if (existente) existente.quantidade += 1;
      else carrinho.push({ id, quantidade: 1 });
      atualizarTela();
      return true;
    }

    function alterarQuantidade(id, delta) {
      const item = carrinho.find((i) => i.id === id);
      if (!item) return;
      item.quantidade += delta;
      if (item.quantidade <= 0) carrinho = carrinho.filter((i) => i.id !== id);
      atualizarTela();
    }

    function remover(id) {
      carrinho = carrinho.filter((i) => i.id !== id);
      atualizarTela();
    }

    function limparCarrinho() {
      carrinho = [];
      atualizarTela();
    }

    function calcularTotal() {
      return carrinho.reduce(
        (t, i) => t + bancoProdutos[i.id].preco * i.quantidade,
        0
      );
    }

    function contarItens() {
      return carrinho.reduce((t, i) => t + i.quantidade, 0);
    }

    function atualizarTela() {
      const itensDiv = $("itens");

      if (carrinho.length === 0) {
        itensDiv.innerHTML =
          '<p class="vazio">Carrinho vazio.<br>Escaneie um código de barras para começar.</p>';
      } else {
        itensDiv.innerHTML = carrinho
          .map((i) => {
            const p = bancoProdutos[i.id];
            return `
            <div class="item" data-id="${i.id}">
              <div>
                <div class="item-nome">${p.nome}</div>
                <div class="item-unit">${moeda(p.preco)} cada</div>
              </div>
              <div class="item-subtotal">${moeda(p.preco * i.quantidade)}</div>
              <div class="item-controles">
                <button type="button" data-acao="menos" aria-label="Diminuir quantidade de ${p.nome}">−</button>
                <span class="qtd">${i.quantidade}</span>
                <button type="button" data-acao="mais" aria-label="Aumentar quantidade de ${p.nome}">+</button>
                <button type="button" class="remover" data-acao="remover">Remover</button>
              </div>
            </div>`;
          })
          .join("");
      }

      const n = contarItens();
      $("contador").textContent = n + (n === 1 ? " item" : " itens");
      $("total").textContent = moeda(calcularTotal());
      $("btn-finalizar").disabled = carrinho.length === 0;
      $("btn-limpar").style.display = carrinho.length === 0 ? "none" : "";
      salvarCarrinho();
    }

    $("itens").addEventListener("click", (e) => {
      const botao = e.target.closest("button[data-acao]");
      if (!botao) return;
      const id = botao.closest(".item").dataset.id;
      const acao = botao.dataset.acao;
      if (acao === "mais") alterarQuantidade(id, 1);
      else if (acao === "menos") alterarQuantidade(id, -1);
      else if (acao === "remover") remover(id);
    });

    $("btn-limpar").addEventListener("click", () => {
      if (confirm("Remover todos os itens do carrinho?")) limparCarrinho();
    });

    let timerStatus;
    function mostrarStatus(texto, tipo) {
      const el = $("status");
      el.textContent = texto;
      el.className = tipo || "";
      clearTimeout(timerStatus);
      if (tipo && scannerAtivo) {
        timerStatus = setTimeout(() => {
          el.textContent = MSG_CAMERA;
          el.className = "";
        }, 2000);
      }
    }

    let audioCtx;
    function bipe(frequencia) {
      try {
        audioCtx =
          audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const ganho = audioCtx.createGain();
        osc.frequency.value = frequencia;
        ganho.gain.value = 0.08;
        osc.connect(ganho);
        ganho.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        /* sem áudio */
      }
    }

    function flashScanner() {
      const box = $("scanner-container");
      if (!box.classList.contains("ativo")) return;
      box.classList.remove("flash");
      void box.offsetWidth;
      box.classList.add("flash");
    }

    function feedbackSucesso() {
      bipe(880);
      if (navigator.vibrate) navigator.vibrate(100);
      flashScanner();
    }

    function feedbackErro() {
      bipe(220);
      if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
    }

    let leitorQr = null;
    let scannerAtivo = false;
    let ultimoCodigo = "";
    let ultimoMomento = 0;

    function processarCodigo(textoLido) {
      const codigo = normalizarCodigo(textoLido);
      const agora = Date.now();

      if (
        codigo === ultimoCodigo &&
        agora - ultimoMomento < ESPERA_MESMO_CODIGO_MS
      ) {
        return;
      }
      ultimoCodigo = codigo;
      ultimoMomento = agora;

      if (adicionar(codigo)) {
        feedbackSucesso();
        mostrarStatus("✔ " + bancoProdutos[codigo].nome + " adicionado", "ok");
      } else {
        feedbackErro();
        mostrarStatus("Produto não cadastrado: " + codigo, "erro");
      }
    }

    function formatosCodigoBarras() {
      const F = Html5QrcodeSupportedFormats;
      return [
        F.EAN_13,
        F.EAN_8,
        F.UPC_A,
        F.UPC_E,
        F.CODE_128,
        F.CODE_39,
        F.ITF,
        F.QR_CODE
      ];
    }

    async function iniciarScanner() {
      if (scannerAtivo) return;
      leitorQr = new Html5Qrcode("qr-reader");
      $("scanner-container").classList.add("ativo");

      const config = {
        fps: 10,
        qrbox: (largura, altura) => {
          const w = Math.floor(Math.min(largura * 0.92, 360));
          const h = Math.floor(Math.min(altura * 0.28, 140));
          return { width: w, height: Math.max(h, 80) };
        },
        formatsToSupport: formatosCodigoBarras(),
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      };

      try {
        await leitorQr.start(
          { facingMode: "environment" },
          config,
          processarCodigo,
          () => {}
        );
        scannerAtivo = true;
        const b = $("btn-scanner");
        b.textContent = "Parar leitura";
        b.classList.add("btn-parar");
        mostrarStatus(MSG_CAMERA);
      } catch (err) {
        console.error("Erro ao iniciar a câmera:", err);
        $("scanner-container").classList.remove("ativo");
        const semHttps = !window.isSecureContext;
        mostrarStatus(
          semHttps
            ? "A câmera só funciona em página segura (HTTPS ou localhost)."
            : "Não foi possível abrir a câmera. Permita o acesso no navegador.",
          "erro"
        );
      }
    }

    async function pararScanner() {
      if (!scannerAtivo || !leitorQr) return;
      try {
        await leitorQr.stop();
        leitorQr.clear();
      } catch (err) {
        console.error("Erro ao parar a câmera:", err);
      }
      scannerAtivo = false;
      $("scanner-container").classList.remove("ativo");
      const b = $("btn-scanner");
      b.textContent = "Iniciar leitura";
      b.classList.remove("btn-parar");
      mostrarStatus("Leitura parada.");
    }

    $("btn-scanner").addEventListener("click", () => {
      if (scannerAtivo) pararScanner();
      else iniciarScanner();
    });

    $("form-manual").addEventListener("submit", (e) => {
      e.preventDefault();
      const campo = $("codigo-manual");
      if (!campo.value.trim()) return;
      const codigo = normalizarCodigo(campo.value);
      if (adicionar(codigo)) {
        feedbackSucesso();
        mostrarStatus("✔ " + bancoProdutos[codigo].nome + " adicionado", "ok");
        campo.value = "";
      } else {
        feedbackErro();
        mostrarStatus("Produto não cadastrado: " + codigo, "erro");
      }
      campo.focus();
    });

    const dialogo = $("resumo");

    $("btn-finalizar").addEventListener("click", () => {
      $("resumo-itens").innerHTML = carrinho
        .map((i) => {
          const p = bancoProdutos[i.id];
          return `<div class="linha-resumo">
                  <span>${i.quantidade}× ${p.nome}</span>
                  <span>${moeda(p.preco * i.quantidade)}</span>
                </div>`;
        })
        .join("");
      $("resumo-total").textContent = moeda(calcularTotal());
      dialogo.showModal();
    });

    $("btn-voltar").addEventListener("click", () => dialogo.close());

    $("btn-nova").addEventListener("click", () => {
      limparCarrinho();
      dialogo.close();
      mostrarStatus("Nova compra iniciada.");
    });

    $("tabela-produtos").innerHTML = Object.entries(bancoProdutos)
      .map(
        ([codigo, p]) =>
          `<tr><td><code>${codigo}</code></td><td>${p.nome}</td><td>${moeda(p.preco)}</td></tr>`
      )
      .join("");

    carregarCarrinho();
    atualizarTela();
  </script>
</body>
</html>
